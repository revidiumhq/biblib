[package]
name = "biblib"
version = "0.10.0"
edition = "2024"
rust-version = "1.88"
description = "Parse, manage, and deduplicate academic citations"
authors = ["Ali Azlan <aliazlanofficial@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/revidiumhq/biblib"
documentation = "https://docs.rs/biblib"
readme = "README.md"
keywords = ["citations", "deduplication", "nbib", "doi", "bibliography"]
categories = ["science", "text-processing"]
exclude = ["/.github", "/artifacts", "/scripts", "/tests/fixtures"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["csv", "pubmed", "xml", "ris", "enw", "bib", "dedupe", "serde"]
csv = ["dep:csv"]
pubmed = []
xml = ["dep:quick-xml"]
ris = []
enw = []
bib = []
dedupe = ["dep:rayon", "dep:strsim", "dep:unicode-normalization"]
diagnostics = ["dep:ariadne"]
serde = ["dep:serde"]

[dependencies]
thiserror = "2.0.18"
ariadne = { version = "0.6.0", optional = true }
quick-xml = { version = "0.41", optional = true }
csv = { version = "1.4.0", optional = true }
strsim = { version = "0.11.1", optional = true }
rayon = { version = "1.11.0", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
regex-lite = "0.1.9"
either = "1.15.0"
itertools = "0.15.0"
compact_str = "0.10.0"
unicode-normalization = { version = "0.1.24", optional = true }

[dev-dependencies]
pretty_assertions = "1.4.1"
proptest = "1.11.0"
rstest = { version = "0.26.0", default-features = false }

[[bench]]
name = "dedupe"
harness = false
required-features = ["dedupe"]
